<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Single Page Apps for GitHub Pages | react-gh-pages</title>
    <script>
      // Redirect to index with the full path preserved
      const pathSegmentsToKeep = 1;  // for /FitDadForge/ → keep 1 segment
      const l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#' +
        l.pathname.substr(l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/').length) +
        (l.search ? '&' + l.search.substr(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
